services:
  - type: web
    name: agropioo-model-api
    runtime: docker
    plan: free
    rootDir: apps/model-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8001
      - key: MODEL_STORE_DIR
        value: /app/model_store
