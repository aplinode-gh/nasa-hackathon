[project]
name = "model-api"
version = "0.0.0"
description = "Agropioo crop-rotation model service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "requests>=2.31",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
  "shap>=0.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
